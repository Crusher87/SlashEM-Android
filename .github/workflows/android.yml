name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib bison flex groff-base bsdextrautils

      # The Android command-line tools need Java 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3 ndk;21.4.7075529'

      - name: Point the native build at the NDK
        run: sed -i -e "s,^NDK = .*,NDK = $ANDROID_SDK_ROOT/ndk/21.4.7075529,g" sys/android/Makefile.src

      - name: Build native library and game data
        run: cd sys/android && sh ./setup.sh && cd ../.. && make install

      - name: Check native library
        run: |
          file sys/android/app/libs/*/libslashem.so
          if readelf -d sys/android/app/libs/*/libslashem.so | grep -q TEXTREL; then
            echo "libslashem.so has text relocations; Android will refuse to load it"; exit 1
          fi

      # Android Gradle Plugin 4.x and Gradle 6.9 need Java 8 or 11.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build APK
        run: cd sys/android && sh gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: slashem-debug-apk
          path: sys/android/app/build/outputs/apk/debug/app-debug.apk
